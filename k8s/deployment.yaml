apiVersion: apps/v1
kind: Deployment
metadata:
  name: italia-landing
  namespace: italia-landing
  labels:
    app: italia-landing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: italia-landing
  template:
    metadata:
      labels:
        app: italia-landing
    spec:
      containers:
        - name: italia-landing
          image: ghcr.io/nulp-ai-enterprise/italia-landing:sha-e53e0e3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 12
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-secret
